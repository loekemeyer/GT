<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Producción GT" />
  <meta name="theme-color" content="#1e40af" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Producción GT</title>
  <link rel="icon" href="data:," />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css?v=1.0" />
</head>
<body>
  <!-- 1) CÓDIGO DE INGRESO (el del monitor, cambia cada minuto) -->
  <div id="claveScreen">
    <h1>Producción GT</h1>
    <div class="label">🔑 Código de ingreso (en el monitor)</div>
    <input id="claveInput" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000" />
    <div id="claveError" class="error"></div>
    <button id="claveBtn" class="primary-btn">Siguiente</button>
    <div class="version"><span id="verBadge"></span> · <a href="admin.html">⚙ Admin</a></div>
  </div>

  <!-- 1b) ¿QUIÉN SOS? -->
  <div id="nombreScreen" class="hidden">
    <div class="top-bar"><span class="back-top" id="nombreVolver">←</span><span class="op-name">¿Quién sos?</span></div>
    <div id="nombreLista" class="nombres"></div>
  </div>

  <!-- 2) BOTONERA -->
  <div id="optionsScreen" class="hidden">
    <div class="top-bar">
      <span class="back-top" id="salirBtn" title="Cambiar operario">←</span>
      <span class="op-name" id="opName"></span>
      <span class="sync" id="syncBadge"></span>
    </div>
    <div id="abiertaBox" class="abierta hidden"></div>
    <div id="botonera"></div>
    <button id="histBtn" class="sec-btn">📋 Resumen de hoy</button>
    <div id="hist" class="hidden"></div>
  </div>

  <!-- 3) TERMINÉ: cantidad + «¿con qué seguís?» en la misma pantalla (v9.0) -->
  <div id="cantScreen" class="hidden">
    <div class="top-bar"><span class="back-top" id="cantVolver">←</span><span class="op-name" id="cantTitulo"></span></div>
    <div class="cant-sub" id="cantSub"></div>
    <div id="cantBox">
      <div class="label" id="cantLabel"></div>
      <input id="cantInput" class="text-input" inputmode="decimal" autocomplete="off" placeholder="0" />
      <div id="cantError" class="error"></div>
    </div>
    <div class="sigue">
      <div class="label" id="sigueLabel"></div>
      <div id="sigueOpts" class="cod-opts hidden"></div>
      <div id="siguePend" class="cod-pend hidden"></div>
      <input id="sigueInput" class="text-input" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="characters" placeholder="Código" />
      <div id="sigueHint" class="cod-hint"></div>
      <div id="sigueError" class="error"></div>
    </div>
    <button id="cantBtn" class="primary-btn">Terminar y seguir</button>
    <button id="cambioBtn" class="sec-btn">Cambiar de área / no sigo</button>
  </div>

  <!-- 4) CÓDIGO (al empezar un área que lo pide, hoy Grampeado) -->
  <div id="codScreen" class="hidden">
    <div class="top-bar"><span class="back-top" id="codVolver">←</span><span class="op-name" id="codTitulo"></span></div>
    <div class="label" id="codLabel"></div>
    <div id="codOpts" class="cod-opts hidden"></div>
    <div id="codPend" class="cod-pend hidden"></div>
    <input id="codInput" class="text-input" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="characters" placeholder="Código" />
    <div id="codHint" class="cod-hint"></div>
    <div id="codError" class="error"></div>
    <button id="codBtn" class="primary-btn">Empezar</button>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="config.js?v=1.0"></script>
  <script src="app.js?v=1.0"></script>
</body>
</html>
