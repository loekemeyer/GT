<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Producción GT" />
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Producción GT</title>
  <link rel="icon" href="data:," />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css?v=1.28" />
</head>
<body>
  <!-- 1) CÓDIGO DE INGRESO (el del monitor, cambia cada minuto) -->
  <div id="claveScreen" class="pantalla">
    <div class="marca">
      <div class="marca-logo">GT</div>
      <h1>Producción GT</h1>
      <p class="mut">Tierra Nativa</p>
    </div>
    <div class="tarjeta">
      <label class="label" for="claveInput">🔑 Código de ingreso</label>
      <p class="mut chico">Está en el monitor y cambia cada minuto</p>
      <input id="claveInput" class="input-clave" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="····" />
      <div id="claveError" class="error"></div>
    </div>
    <div class="acciones">
      <button id="claveBtn" class="primary-btn">Siguiente</button>
      <div class="version"><span id="verBadge"></span> · <a href="admin.html">Admin</a></div>
    </div>
  </div>

  <!-- 1b) ¿QUIÉN SOS? -->
  <div id="nombreScreen" class="pantalla hidden">
    <header class="top-bar"><button class="back-top" id="nombreVolver" aria-label="Volver">‹</button><span class="op-name">¿Quién sos?</span><span class="top-esp"></span></header>
    <div id="nombreLista" class="nombres"></div>
  </div>

  <!-- 1c) ¿EN QUÉ PLANTA? (1.22, Thomas): sólo a quien trabaja en más de una planta (Darío Méndez y Luis Luna) -->
  <div id="plantaScreen" class="pantalla hidden">
    <header class="top-bar"><button class="back-top" id="plantaVolver" aria-label="Volver">‹</button><span class="op-name" id="plantaTitulo"></span><span class="top-esp"></span></header>
    <div class="tarjeta">
      <label class="label">🏭 ¿En qué planta trabajás hoy?</label>
      <div id="plantaOpts" class="cod-opts"></div>
    </div>
  </div>

  <!-- 2) BOTONERA -->
  <div id="optionsScreen" class="pantalla hidden">
    <header class="top-bar">
      <button class="back-top" id="salirBtn" aria-label="Cambiar operario">‹</button>
      <span class="op-name" id="opName"></span>
      <span class="sync" id="syncBadge"></span>
    </header>
    <div id="abiertaBox" class="abierta hidden"></div>
    <div id="botonera"></div>
    <div class="jornada">
      <button id="almuBtn" class="sec-btn">🍽️ Almuerzo</button>
      <button id="finBtn" class="fin-btn">🏁 Terminar día</button>
    </div>
    <button id="histBtn" class="sec-btn">📋 Resumen de hoy</button>
    <button id="plantaBtn" class="sec-btn hidden">🏭 Cambiar de planta</button>
  </div>

  <!-- 3) TERMINÉ: cantidad + «¿con qué seguís?» en la misma pantalla -->
  <div id="cantScreen" class="pantalla hidden">
    <header class="top-bar"><button class="back-top" id="cantVolver" aria-label="Volver">‹</button><span class="op-name" id="cantTitulo"></span><span class="top-esp"></span></header>
    <div class="cant-sub mut" id="cantSub"></div>
    <div id="cantBox" class="tarjeta">
      <label class="label" id="cantLabel" for="cantInput"></label>
      <input id="cantInput" class="text-input" inputmode="decimal" autocomplete="off" placeholder="0" />
      <div id="cantError" class="error"></div>
    </div>
    <div class="tarjeta sigue" id="sigueBox">
      <label class="label" id="sigueLabel" for="sigueInput"></label>
      <div id="sigueOpts" class="cod-opts hidden"></div>
      <div id="siguePend" class="cod-pend hidden"></div>
      <input id="sigueInput" class="text-input" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="characters" placeholder="Código" />
      <div id="sigueHint" class="cod-hint"></div>
      <div id="sigueError" class="error"></div>
    </div>
    <div class="acciones">
      <button id="cantBtn" class="primary-btn">Terminar y seguir</button>
      <button id="cambioBtn" class="sec-btn">Cambiar de área / no sigo</button>
      <div id="salidaBox" class="row-2">
        <button id="cantAlmuBtn" class="sec-btn">🍽️ Me voy a almorzar</button>
        <button id="cantFinBtn" class="sec-btn">🏁 Terminé el día</button>
      </div>
    </div>
  </div>

  <!-- 4b) MEDIDA (1.17): set de 3 en Montaje / Gancho → qué medida va a hacer -->
  <div id="medScreen" class="pantalla hidden">
    <header class="top-bar"><button class="back-top" id="medVolver" aria-label="Volver">‹</button><span class="op-name" id="medTitulo"></span><span class="top-esp"></span></header>
    <div class="tarjeta">
      <label class="label" id="medLabel"></label>
      <div id="medOpts" class="cod-opts"></div>
    </div>
  </div>

  <!-- 1.24: PREGUNTAS DEL ÁREA (Esnaola: moldura, anilina, color) — salen de gt.rubro_pasos -->
  <div id="pasoScreen" class="pantalla hidden">
    <header class="top-bar"><button class="back-top" id="pasoVolver" aria-label="Volver">‹</button><span class="op-name" id="pasoTitulo"></span><span class="top-esp"></span></header>
    <div class="tarjeta">
      <div id="pasoResp" class="paso-resp hidden"></div>
      <label class="label" id="pasoLabel"></label>
      <div id="pasoOpts" class="cod-opts"></div>
    </div>
  </div>

  <!-- 4) CÓDIGO (al empezar un área que lo pide) -->
  <div id="codScreen" class="pantalla hidden">
    <header class="top-bar"><button class="back-top" id="codVolver" aria-label="Volver">‹</button><span class="op-name" id="codTitulo"></span><span class="top-esp"></span></header>
    <div class="tarjeta">
      <label class="label" id="codLabel" for="codInput"></label>
      <div id="codOpts" class="cod-opts hidden"></div>
      <div id="codPend" class="cod-pend hidden"></div>
      <input id="codInput" class="text-input" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="characters" placeholder="Código" />
      <div id="codHint" class="cod-hint"></div>
      <div id="codError" class="error"></div>
    </div>
    <div class="acciones">
      <button id="codBtn" class="primary-btn">Empezar</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <!-- v1.10: «Resumen de hoy» es un pop-up, no se despliega abajo de la botonera -->
  <div id="histPop" class="pop hidden" role="dialog" aria-modal="true" aria-labelledby="histTit">
    <div class="pop-caja">
      <div class="pop-cab"><h2 id="histTit">📋 Resumen de hoy</h2><button id="histCerrar" class="pop-x" aria-label="Cerrar">✕</button></div>
      <div id="hist" class="pop-cuerpo"></div>
    </div>
  </div>
  <script src="config.js?v=1.28"></script>
  <script src="app.js?v=1.28"></script>
</body>
</html>
