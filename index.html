<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Producción GT" />
  <meta name="theme-color" content="#1e40af" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Producción GT</title>
  <link rel="icon" href="data:," />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css?v=1.0" />
</head>
<body>
  <!-- 1) LEGAJO -->
  <div id="legajoScreen">
    <h1>Producción GT</h1>
    <input id="legajoInput" inputmode="numeric" autocomplete="off" placeholder="Legajo" />
    <div id="legajoError" class="error"></div>
    <button id="legajoBtn" class="primary-btn">Entrar</button>
    <div class="version" id="verBadge"></div>
  </div>

  <!-- 2) BOTONERA -->
  <div id="optionsScreen" class="hidden">
    <div class="top-bar">
      <span class="back-top" id="salirBtn" title="Cambiar operario">←</span>
      <span class="op-name" id="opName"></span>
      <span class="sync" id="syncBadge"></span>
    </div>
    <div id="abiertaBox" class="abierta hidden"></div>
    <div id="botonera"></div>
    <button id="histBtn" class="sec-btn">📋 Resumen de hoy</button>
    <div id="hist" class="hidden"></div>
  </div>

  <!-- 3) TEXTO (tarea que pide un dato) -->
  <div id="textoScreen" class="hidden">
    <div class="selected-container">
      <span class="back-arrow" id="textoVolver">←</span>
      <span class="selected-box" id="textoCodigo"></span>
      <span class="selected-desc" id="textoDesc"></span>
    </div>
    <div class="label" id="textoLabel"></div>
    <input id="textoInput" class="text-input" autocomplete="off" />
    <div id="textoError" class="error"></div>
    <button id="textoBtn" class="primary-btn">Enviar</button>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="config.js?v=1.0"></script>
  <script src="app.js?v=1.0"></script>
</body>
</html>
