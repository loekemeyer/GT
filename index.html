<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Producción GT" />
  <meta name="theme-color" content="#1e40af" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Producción GT</title>
  <link rel="icon" href="data:," />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css?v=2.0" />
</head>
<body>
  <!-- 1) CÓDIGO DE INGRESO (el del monitor, cambia cada minuto) -->
  <div id="claveScreen">
    <h1>Producción GT</h1>
    <div class="label">🔑 Código de ingreso (en el monitor)</div>
    <input id="claveInput" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000" />
    <div id="claveError" class="error"></div>
    <button id="claveBtn" class="primary-btn">Siguiente</button>
    <div class="version"><span id="verBadge"></span> · <a href="admin.html">⚙ Admin</a></div>
  </div>

  <!-- 1b) ¿QUIÉN SOS? -->
  <div id="nombreScreen" class="hidden">
    <div class="top-bar"><span class="back-top" id="nombreVolver">←</span><span class="op-name">¿Quién sos?</span></div>
    <div id="nombreLista" class="nombres"></div>
  </div>

  <!-- 2) BOTONERA -->
  <div id="optionsScreen" class="hidden">
    <div class="top-bar">
      <span class="back-top" id="salirBtn" title="Cambiar operario">←</span>
      <span class="op-name" id="opName"></span>
      <span class="sync" id="syncBadge"></span>
    </div>
    <div id="abiertaBox" class="abierta hidden"></div>
    <div id="botonera"></div>
    <button id="histBtn" class="sec-btn">📋 Resumen de hoy</button>
    <div id="hist" class="hidden"></div>
  </div>

  <!-- 3) TEXTO (tarea que pide un dato) -->
  <div id="textoScreen" class="hidden">
    <div class="selected-container">
      <span class="back-arrow" id="textoVolver">←</span>
      <span class="selected-box" id="textoCodigo"></span>
      <span class="selected-desc" id="textoDesc"></span>
    </div>
    <div class="label" id="textoLabel"></div>
    <input id="textoInput" class="text-input" autocomplete="off" />
    <div id="textoError" class="error"></div>
    <button id="textoBtn" class="primary-btn">Enviar</button>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="config.js?v=2.0"></script>
  <script src="app.js?v=2.0"></script>
</body>
</html>
