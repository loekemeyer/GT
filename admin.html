<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#f4f5f7" />
  <title>GT Admin</title>
  <link rel="icon" href="data:," />
  <style>
    :root{--bg:#f4f5f7;--card:#fff;--fg:#1c1f24;--mut:#6b7280;--borde:#e3e5e9;--acc:#2563eb;--acc-bg:#eaf1ff;
          --warn:#d97706;--warn-bg:#fff6e5;--err:#dc2626;--err-bg:#fdecec;--ok:#16a34a;--ok-bg:#e9f8ef;--r:14px;
          --sombra:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.06);}
    @media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e25;--fg:#eef0f3;--mut:#9aa1ad;--borde:#2c3039;--acc:#4f8cff;
          --acc-bg:#1d2a44;--warn:#f0a43a;--warn-bg:#33270f;--err:#f26464;--err-bg:#3a1a1a;--ok:#3ccf73;--ok-bg:#15301f;--sombra:none;}}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
    .hidden{display:none !important;}
    header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--borde);background:var(--card);}
    header h1{font-size:18px;margin:0;flex:1;}
    header a{color:var(--mut);font-size:14px;}
    .tabs{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;}
    .tab{border:1px solid var(--borde);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;}
    .tab.on{background:var(--acc);border-color:var(--acc);color:#fff;}
    button{font:inherit;cursor:pointer;}

    /* MONITOR: sólo el código de ingreso, centrado y grande */
    #monitor{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 130px);gap:2vh;}
    .rot{font-size:clamp(18px,3vw,40px);color:var(--mut);letter-spacing:2px;text-transform:uppercase;}
    .clave-fila{display:flex;align-items:center;gap:3vw;}
    #clave{font-size:clamp(90px,20vw,320px);font-weight:bold;letter-spacing:.08em;font-variant-numeric:tabular-nums;line-height:1;}
    .rueda{width:clamp(60px,9vw,150px);height:clamp(60px,9vw,150px);}
    .rueda circle{fill:none;stroke-width:10;}
    .rueda .fondo{stroke:var(--borde);}
    .rueda .arco{stroke:var(--acc);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .9s linear;}
    .rueda text{font-size:30px;font-weight:bold;fill:var(--fg);text-anchor:middle;dominant-baseline:central;}
    #estado{font-size:14px;color:var(--mut);min-height:1em;}
    #estado.err{color:var(--err);}

    .login{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:12vh;}
    .login input{font-size:40px;width:260px;text-align:center;letter-spacing:8px;padding:8px;border-radius:12px;border:2px solid var(--borde);background:var(--card);color:var(--fg);}
    .login button{font-size:20px;padding:10px 40px;border-radius:12px;border:none;background:var(--acc);color:#fff;}
    .err-txt{color:var(--err);min-height:1em;}

    /* PRODUCCIÓN y ASISTENCIA: tablas compactas, ancho según el dato, todo centrado */
    .panel{padding:0 16px 24px;max-width:1100px;margin:0 auto;}
    .barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 12px;}
    .barra input,.barra select{font:inherit;font-size:15px;padding:7px 10px;border-radius:10px;border:1px solid var(--borde);background:var(--card);color:var(--fg);}
    .barra button{border:1px solid var(--borde);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 12px;font-size:15px;}
    .barra .info{color:var(--mut);font-size:13px;}
    .bloque{background:var(--card);border-radius:var(--r);box-shadow:var(--sombra);padding:12px;margin-bottom:14px;overflow-x:auto;}
    .bloque h2{font-size:15px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;}
    table{border-collapse:collapse;font-size:14px;margin:0 auto;}
    th{font-size:12px;color:var(--mut);font-weight:600;padding:4px 8px;border-bottom:1px solid var(--borde);line-height:1.15;}
    td{padding:5px 8px;text-align:center;border-bottom:1px solid var(--borde);font-variant-numeric:tabular-nums;white-space:nowrap;}
    tr:last-child td{border-bottom:0;}
    td.izq{text-align:left;}
    td.num{font-weight:700;}
    .sep td{border-top:2px solid var(--borde);}
    tr.curso td{background:var(--warn-bg);}
    tr.auto td{background:var(--acc-bg, #eaf1ff);}
    td.poco{color:var(--mut);font-style:italic;}
    td.malo{color:var(--err, #dc2626);font-weight:700;} td.bueno{color:var(--ok, #16a34a);font-weight:700;}
    .chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;margin:1px 2px;}
    .c-ok{background:var(--ok-bg);color:var(--ok);} .c-warn{background:var(--warn-bg);color:var(--warn);} .c-err{background:var(--err-bg);color:var(--err);}
    .t-err{color:var(--err);font-weight:700;} .t-warn{color:var(--warn);font-weight:700;}
    .vacio{text-align:center;color:var(--mut);padding:18px;}
    .desc{color:var(--mut);font-size:12px;}
    /* PEDIDOS */
    .ped-cab{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-bottom:8px;} .ped-cab b{font-size:16px;}
    .ped-acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;}
    .ped-acc button{border:1px solid var(--borde);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 12px;font-size:14px;}
    .ped-acc button.prim{background:var(--acc);border-color:var(--acc);color:#fff;} .ped-acc button.peligro{color:var(--err);}
    .ped-msg{font-size:13px;color:var(--mut);}
    /* BOTONERA (1.66): la app del operario en un marco del ancho de un celular (390 px), sin espacio muerto alrededor */
    .cel{width:390px;max-width:100%;height:min(760px,calc(100vh - 200px));border:1px solid var(--borde);border-radius:var(--r);
         overflow:hidden;background:var(--card);box-shadow:var(--sombra);}
    .cel iframe{width:100%;height:100%;border:0;display:block;}
    td input.arm{width:64px;font:inherit;font-size:14px;text-align:center;padding:4px;border-radius:8px;border:1px solid var(--borde);background:var(--card);color:var(--fg);}
    .c-mut{background:var(--borde);color:var(--mut);}
    /* EMPLEADOS (1.69) */
    .barra button.prim,.ped-acc button.prim{background:var(--acc);border-color:var(--acc);color:#fff;}
    .ef-fila{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:10px;}
    .ef-fila label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);font-weight:600;}
    .ef-fila label.ef-chk,.ef-chk{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--fg);font-weight:500;}
    .ef-chk{display:flex;gap:14px;}
    .ef-fila input[type=text]{font:inherit;font-size:15px;padding:7px 10px;border-radius:10px;border:1px solid var(--borde);background:var(--card);color:var(--fg);width:220px;}
    #efLegajo{width:90px !important;}
    #efSemana input[type=time]{font:inherit;font-size:14px;padding:4px 6px;border-radius:8px;border:1px solid var(--borde);background:var(--card);color:var(--fg);}
    #efSemana input[type=time]:disabled{opacity:.35;}
    #efSemana td.dia{text-align:left;font-weight:600;}
    #efSemana tr.libre td{color:var(--mut);}
    #empForm button{border:1px solid var(--borde);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 12px;font-size:14px;}
    #empForm button.prim{background:var(--acc);border-color:var(--acc);color:#fff;}
    #efMsg.err{color:var(--err);font-weight:600;}
    td.acc button{border:1px solid var(--borde);background:var(--card);color:var(--fg);border-radius:8px;padding:4px 10px;font-size:13px;margin:0 2px;}
    td.acc button.peligro{color:var(--err);}
    tr.baja td{color:var(--mut);}
    /* CAJAS (1.68) */
    .aviso-c{background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;margin:0 auto 10px;width:fit-content;max-width:100%;}
    td.caja-n{font-weight:700;font-size:16px;} td.caja-armar{color:var(--warn);font-weight:700;} td.caja-nomas{background:var(--err-bg);color:var(--err);font-weight:800;}
  </style>
</head>
<body>
  <header>
    <h1>GT · Admin</h1>
    <a href="#" id="salirMon">Salir</a>
    <a href="./">← App de operario</a>
  </header>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="monitor">📺 Monitor</button>
    <button class="tab" data-tab="prod">📊 Producción</button>
    <button class="tab" data-tab="asis">⏰ Asistencia</button>
    <button class="tab" data-tab="emp">👥 Empleados</button>
    <button class="tab" data-tab="ped">📦 Pedidos</button>
    <button class="tab" data-tab="cajas">🗃️ Cajas</button>
    <button class="tab" data-tab="rend">📈 Rendimiento</button>
    <button class="tab" data-tab="bot">👁 Botonera</button>
  </nav>

  <!-- CLAVE DEL MONITOR: la valida la base (gt_monitor_clave). Se recuerda en ESTA máquina hasta «Salir» o hasta el lunes 07:00 (v1.6). El ingreso tipeado va por gt_monitor_login. -->
  <div id="login" class="login hidden">
    <div class="rot">🔒 Clave del monitor</div>
    <input id="passInput" type="password" inputmode="numeric" autocomplete="off" />
    <button id="passBtn">Entrar</button>
    <div id="passError" class="err-txt"></div>
  </div>

  <main id="monitor" class="vista hidden">
    <div class="rot">🔑 Código de ingreso</div>
    <div class="clave-fila">
      <div id="clave">····</div>
      <svg class="rueda" viewBox="0 0 100 100" aria-label="segundos para el próximo código">
        <circle class="fondo" cx="50" cy="50" r="42"></circle>
        <circle class="arco" id="arco" cx="50" cy="50" r="42" stroke-dasharray="263.9" stroke-dashoffset="0"></circle>
        <text x="50" y="50" id="seg">--</text>
      </svg>
    </div>
    <div id="estado"></div>
  </main>

  <section id="prod" class="vista panel hidden">
    <div class="barra"><input type="date" id="prodDia" /><button id="prodRef">↻ Actualizar</button>
      <select id="fArea" aria-label="Área"></select><select id="fOper" aria-label="Operario"></select><select id="fFam" aria-label="Familia"></select>
      <span class="info" id="prodInfo"></span></div>
    <div class="bloque"><h2>Por área</h2><div id="prodArea"></div></div>
    <div class="bloque"><h2>Ritmo por operario</h2><div id="prodRitmo"></div></div>
    <div class="bloque"><h2>Por operario</h2><div id="prodOp"></div></div>
  </section>

  <!-- EMPLEADOS (1.69, Angely 30/10/2026): «un módulo para ingresar o dar de baja a los empleados… sus datos y su horario, para que el programa
       pueda controlar su fichada». Alta y baja (activo = false: no se borra nada, el historial queda) con el horario por día de la semana.
       El horario lo leen Asistencia, los avisos de llegada y el cierre automático (gt_v186 / gt_v187). -->
  <section id="emp" class="vista panel hidden">
    <div class="barra"><button id="empNuevo" class="prim">＋ Alta de empleado</button><button id="empRef">↻ Actualizar</button>
      <label class="info"><input type="checkbox" id="empBajas" checked /> ver dados de baja</label><span class="info" id="empInfo"></span></div>
    <div id="empForm" class="bloque hidden">
      <h2 id="efTit">Alta de empleado</h2>
      <div class="ef-fila">
        <label>Nombre y apellido<input type="text" id="efNombre" autocomplete="off" maxlength="60" /></label>
        <label>Legajo<input type="text" id="efLegajo" autocomplete="off" maxlength="12" placeholder="t175" /></label>
        <div class="ef-chk" id="efPlantas"></div>
      </div>
      <table id="efSemana"></table>
      <div class="ef-fila">
        <label class="ef-chk"><input type="checkbox" id="efFlex" /> Almuerzo flexible (cada día come a otra hora: no se controla)</label>
        <button id="efCopiar" type="button">Copiar el lunes a lun–vie</button>
      </div>
      <div class="ped-acc"><button id="efGuardar" class="prim">Guardar</button><button id="efCancelar" type="button">Cancelar</button><span class="ped-msg" id="efMsg"></span></div>
    </div>
    <div class="bloque"><div id="empLista"></div></div>
  </section>

  <section id="asis" class="vista panel hidden">
    <div class="barra"><input type="date" id="asisDia" /><button id="asisRef">↻ Actualizar</button><span class="info" id="asisInfo"></span></div>
    <div class="bloque"><div id="asisTabla"></div></div>
  </section>

  <!-- PEDIDOS (D29, Thomas 01/10: «por ahora solo desde el admin»): los de la página de TN entran solos (gt.sync_pedidos_tn);
       acá se marca qué se armó, se carga al camión, se entrega o se cancela. -->
  <!-- RENDIMIENTO (1.37, Elías): una tabla por área; filas = la variable, columnas = los operarios, celda = segundos por unidad -->
  <section id="rend" class="vista panel hidden">
    <div class="barra"><input type="date" id="rendDesde" aria-label="Desde" /><input type="date" id="rendHasta" aria-label="Hasta" />
      <button id="rendRef">↻ Actualizar</button><span class="info" id="rendInfo"></span></div>
    <div id="rendTablas"></div>
  </section>

  <section id="ped" class="vista panel hidden">
    <div class="barra"><button id="pedRef">↻ Actualizar</button><label class="info"><input type="checkbox" id="pedCerr" /> ver entregados y cancelados (30 días)</label><span class="info" id="pedInfo"></span></div>
    <div id="pedLista"></div>
  </section>

  <!-- CAJAS (1.68, Angely 29/10/2026: D4 «sí»): cuántas cajas hay que armar, EN VIVO. Sale de lo emblistado que todavía no se contrajo
       menos las cajas armadas, por número de caja (gt_admin_cajas → gt.demanda_cajas). Hasta el corte de conteo no muestra números. -->
  <section id="cajas" class="vista panel hidden">
    <div class="barra"><button id="cajasRef">↻ Actualizar</button><span class="info" id="cajasInfo"></span></div>
    <div id="cajasAviso"></div>
    <div class="bloque"><div id="cajasTabla"></div></div>
  </section>

  <!-- BOTONERA DEL OPERARIO (1.66, Thomas 19/10/2026: «un módulo para ver botonera de operario sin mover stocks ni
       contabilizar para productividad»): es la app REAL (index.html) en modo vista (1.52) dentro de un iframe, abierta con
       ?vista=1 y el código del monitor en ?cod=. En modo vista nada sale del celular: no hay INGRESO, no hay «Empecé» ni
       «Terminé» en gt.registros, así que no toca stock, Producción, Ritmo ni Rendimiento. No se copia la botonera acá a
       propósito: dos botoneras terminan divergiendo. -->
  <section id="bot" class="vista panel hidden">
    <div class="barra"><button id="botRef">↻ Reiniciar</button><span class="info" id="botInfo"></span></div>
    <div class="cel"><iframe id="botFrame" title="Botonera del operario (modo vista)" referrerpolicy="no-referrer"></iframe></div>
  </section>

  <script src="config.js?v=1.69"></script>
  <script>
  (function () {
    const CFG = window.GT_CFG, CIRC = 263.9, LS_PASS = "gt_monitor_pass";
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const num = (n) => Number(n).toLocaleString("es-AR");
    const hhmm = (ts) => ts ? String(ts).slice(11, 16) : "";                       // timestamp sin zona (hora AR)
    const hhmmTz = (ts) => ts ? new Date(ts).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: "America/Argentina/Buenos_Aires" }) : "";
    const hoyAR = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
    const durMin = (a, b) => Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000));
    const hm = (m) => Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0");
    let fin = 0, timer = null, ultimoOk = 0, pass = null, tab = "monitor";
    // v1.6: la clave guardada VENCE cada lunes 07:00 (hora AR): ese día Javier la vuelve a poner.
    // Lunes 07:00 más reciente, en ms. Una clave guardada antes de eso no vale.
    const LS_PASS_TS = "gt_monitor_pass_ts", LS_DISP = "gt_dispositivo";
    let vencio = false;
    function inicioSemana(now) {
      const ar = new Date((now || Date.now()) - 3 * 3600e3);          // reloj AR como si fuera UTC
      const dow = (ar.getUTCDay() + 6) % 7;                            // 0 = lunes
      let t = Date.UTC(ar.getUTCFullYear(), ar.getUTCMonth(), ar.getUTCDate() - dow, 7) + 3 * 3600e3;
      if (t > (now || Date.now())) t -= 7 * 864e5;
      return t;
    }
    function passVencida() {
      let ts = 0; try { ts = Number(localStorage.getItem(LS_PASS_TS)) || 0; } catch {}
      return ts < inicioSemana();
    }
    function olvidarPass() { pass = null; try { localStorage.removeItem(LS_PASS); localStorage.removeItem(LS_PASS_TS); } catch {} }
    function dispositivo() {
      try { let d = localStorage.getItem(LS_DISP);
        if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); localStorage.setItem(LS_DISP, d); }
        return d; } catch { return null; }
    }
    try {
      pass = localStorage.getItem(LS_PASS);
      // clave guardada antes de la 1.6 (sin fecha): vale hasta el próximo lunes, no se la pide hoy
      if (pass && !localStorage.getItem(LS_PASS_TS)) localStorage.setItem(LS_PASS_TS, String(Date.now()));
      if (pass && passVencida()) { olvidarPass(); vencio = true; }
    } catch { /* sin storage */ }

    async function rpc(fn, body) {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
      try {
        const r = await fetch(CFG.SUPABASE_URL + "/rest/v1/rpc/" + fn, { method: "POST", signal: ctl.signal,
          headers: { apikey: CFG.SUPABASE_KEY, Authorization: "Bearer " + CFG.SUPABASE_KEY, "Content-Type": "application/json" },
          body: JSON.stringify(body || {}) });
        if (!r.ok) throw new Error("HTTP " + r.status);
        return await r.json();
      } finally { clearTimeout(t); }
    }

    /* ---------- login y pestañas ---------- */
    function verLogin(msg) {
      clearTimeout(timer); fin = 0;
      document.querySelectorAll(".vista").forEach((v) => v.classList.add("hidden"));
      $("login").classList.remove("hidden");
      $("passError").textContent = msg || ""; $("passInput").value = ""; $("passInput").focus();
    }
    async function entrar() {
      const p = $("passInput").value.trim(); if (!p) return;
      // el ingreso TIPEADO queda registrado; fuera del lunes 07:00–08:00 la base avisa por Telegram
      let r;
      try { r = await rpc("gt_monitor_login", { p_pass: p, p_dispositivo: dispositivo(), p_navegador: navigator.userAgent }); }
      catch (e) { $("passError").textContent = "No pude validar la clave (" + (e.message || e) + ")"; return; }
      if (!r || !r.ok) { olvidarPass(); verLogin("Clave incorrecta"); return; }
      pass = p; vencio = false;
      try { localStorage.setItem(LS_PASS, p); localStorage.setItem(LS_PASS_TS, String(Date.now())); } catch {}
      await pedir(true);
      if (pass && tab !== "monitor") verTab(tab);
    }
    function verTab(t, primera) {
      tab = t;
      document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
      document.querySelectorAll(".vista").forEach((v) => v.classList.toggle("hidden", v.id !== t));
      if (t !== "bot") apagarBotonera();   // 1.66: fuera de la pestaña el iframe no queda corriendo
      if (t === "monitor") pedir(primera); else if (t === "prod") cargarProd(); else if (t === "ped") cargarPed();
      else if (t === "rend") cargarRend(); else if (t === "bot") abrirBotonera(); else if (t === "cajas") cargarCajas(); else if (t === "emp") cargarEmp(); else cargarAsis();
    }
    function sinPermiso() { olvidarPass(); verLogin("Clave incorrecta"); }

    /* ---------- MONITOR ---------- */
    async function pedir(primera) {
      clearTimeout(timer);
      if (pass && passVencida()) { olvidarPass(); verLogin("Es lunes: volvé a poner la clave"); return; }
      const p = pass || "";
      try {
        const d = await rpc("gt_monitor_clave", { p_pass: p });
        if (!d.ok) { if (p) sinPermiso(); else verLogin(vencio ? "Es lunes: volvé a poner la clave" : ""); return; }
        $("login").classList.add("hidden");
        if (tab === "monitor") $("monitor").classList.remove("hidden");
        $("clave").textContent = d.clave;
        fin = Date.now() + d.cambia_en_s * 1000; ultimoOk = Date.now();
        $("estado").textContent = ""; $("estado").classList.remove("err");
        if (tab === "monitor") timer = setTimeout(pedir, d.cambia_en_s * 1000 + 600);
      } catch (e) {
        $("estado").textContent = "⚠ No pude leer el código (" + (e.message || e) + "). Reintentando…";
        $("estado").classList.add("err");
        if (Date.now() - ultimoOk > 120000) $("clave").textContent = "····";
        timer = setTimeout(pedir, 5000);
      }
    }
    setInterval(() => {
      const s = Math.max(0, Math.ceil((fin - Date.now()) / 1000));
      $("seg").textContent = fin ? s : "--";
      $("arco").style.strokeDashoffset = fin ? String(CIRC * (1 - s / 60)) : "0";
    }, 250);

    /* ---------- PRODUCCIÓN ---------- */
    // 1.33 (Elías): filtros por área, operario y familia (valen para las tres tablas), y la duración de cada tramo sin las
    // pausas (Baño, Movimiento) que caen dentro, igual que el ritmo (gt_v147).
    const PAUSAS = ["BANO", "MOVIM", "LIMP"];   // 1.54: Limpieza, igual que Movimientos
    let prodDatos = null;
    async function cargarProd() {
      const dia = $("prodDia").value || hoyAR();
      $("prodInfo").textContent = "Cargando…";
      let rows;
      try { rows = await rpc("gt_admin_produccion3", { p_pass: pass || "", p_dia: dia }); }   // 1.32: + «familia» (gt_v145)
      catch {
        try { rows = await rpc("gt_admin_produccion2", { p_pass: pass || "", p_dia: dia }); }   // 1.14: + «auto»
        catch (e) { $("prodInfo").textContent = "⚠ No pude leer la producción (" + e.message + ")"; return; }
      }
      if (!rows.length && !(await claveOk())) return;
      $("prodInfo").textContent = rows.length + " tramos · actualizado " + new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
      // 1.14 (D35): lo hecho por hora, por operario y área, contra el promedio del área en las 4 semanas anteriores.
      // Sólo tramos de 2 min o más con cantidad; menos de 15 min en el día no se informa (un toque no es un ritmo).
      let ritmo = null, errRitmo = null;
      try { ritmo = await rpc("gt_admin_ritmo2", { p_pass: pass || "", p_dia: dia }); }   // 1.15: por GRUPO (familia)
      catch (e) { errRitmo = e.message; }
      prodDatos = { rows, ritmo, errRitmo };
      llenarFiltros(); pintarProd();
    }
    const famDe = (f) => (f && !/^Código /.test(f) ? f : "");   // un código que va solo no es una familia
    function llenarFiltros() {
      const { rows, ritmo } = prodDatos, rr = ritmo || [];
      const opc = (id, vals, todos) => {
        const sel = $(id), ant = sel.value, l = [...new Set(vals.filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
        sel.innerHTML = '<option value="">' + todos + "</option>" + l.map((v) => '<option value="' + esc(v) + '">' + esc(v) + "</option>").join("");
        sel.value = l.includes(ant) ? ant : "";
      };
      opc("fArea", rows.map((r) => r.area).concat(rr.map((r) => r.area)), "Todas las áreas");
      opc("fOper", rows.map((r) => r.empleado).concat(rr.map((r) => r.empleado)), "Todos los operarios");
      opc("fFam", rows.map((r) => famDe(r.familia)).concat(rr.map((r) => famDe(r.grupo))), "Todas las familias");
    }
    function pintarProd() {
      if (!prodDatos) return;
      const fa = $("fArea").value, fo = $("fOper").value, ff = $("fFam").value;
      const pasa = (area, emp, fam) => (!fa || area === fa) && (!fo || emp === fo) && (!ff || famDe(fam) === ff);
      const todos = prodDatos.rows, ahora = new Date();
      // las pausas del mismo operario que caen dentro del tramo, en ms. 1.36: un baño dentro de un movimiento cuenta una
      // sola vez (unión de los tramos), y un movimiento descuenta el baño que tuvo adentro
      const pausaMs = (r) => {
        if (r.rubro === "BANO") return 0;
        const iv = todos.filter((q) => PAUSAS.includes(q.rubro) && q.rubro !== r.rubro && q.empleado === r.empleado &&
            new Date(q.desde) >= new Date(r.desde) && new Date(q.hasta || ahora) <= new Date(r.hasta || ahora))
          .map((q) => [new Date(q.desde).getTime(), new Date(q.hasta || ahora).getTime()]).sort((x, y) => x[0] - y[0]);
        let tot = 0, cur = null;
        iv.forEach(([a, b]) => { if (!cur || a > cur[1]) { if (cur) tot += cur[1] - cur[0]; cur = [a, b]; } else cur[1] = Math.max(cur[1], b); });
        return cur ? tot + cur[1] - cur[0] : tot;
      };
      const rows = todos.filter((r) => pasa(r.area, r.empleado, r.familia));
      // por área: lo cerrado suma; lo en curso se cuenta aparte
      const porArea = new Map();
      rows.forEach((r) => {
        const a = porArea.get(r.area) || { area: r.area, unidad: r.unidad, cant: 0, unid: 0, conUnid: false, curso: 0, ops: new Set() };
        a.ops.add(r.empleado);
        if (r.hasta) { a.cant += Number(r.cantidad || 0); if (r.unidades != null) { a.unid += Number(r.unidades); a.conUnid = true; } }
        else a.curso++;
        porArea.set(r.area, a);
      });
      const areas = [...porArea.values()].sort((x, y) => (y.conUnid ? y.unid : y.cant) - (x.conUnid ? x.unid : x.cant));
      $("prodArea").innerHTML = areas.length ? "<table><tr><th>Área</th><th>Cant.</th><th>Unidad</th><th>Unid.<br>(cj×UxB)</th><th>Oper.</th><th>En<br>curso</th></tr>" +
        areas.map((a) => "<tr><td class=izq>" + esc(a.area) + "</td><td class=num>" + num(a.cant) + "</td><td>" + esc(a.unidad) +
          "</td><td class=num>" + (a.conUnid ? num(a.unid) : "—") + "</td><td>" + a.ops.size + "</td><td>" + (a.curso || "—") + "</td></tr>").join("") + "</table>"
        : '<div class="vacio">Sin producción registrada' + (fa || fo || ff ? " con ese filtro" : " ese día") + ".</div>";
      let prev = null;
      $("prodOp").innerHTML = rows.length ? "<table><tr><th>Operario</th><th>Área</th><th>Código</th><th>Familia</th><th>Desde</th><th>Hasta</th><th>Dur.</th><th>Cant.</th><th>Unid.</th></tr>" +
        rows.map((r) => {
          const nuevo = r.empleado !== prev; prev = r.empleado;
          const cls = ((r.hasta ? (r.auto ? "auto" : "") : "curso") + (nuevo ? " sep" : "")).trim();
          return '<tr class="' + cls + '"><td class=izq>' + (nuevo ? "<b>" + esc(r.empleado) + "</b>" : "") + "</td><td>" + esc(r.area) +
            "</td><td class=izq>" + esc(r.codigo || "—") + (r.descripcion ? ' <span class="desc">' + esc(r.descripcion) + "</span>" : "") +
            // 1.32 (Elías): la familia (grupo de fabricación: moldura + medida); un código que va solo, «—»
            "</td><td>" + (r.familia && !/^Código /.test(r.familia) ? esc(r.familia) : "—") +
            "</td><td>" + hhmmTz(r.desde) + "</td><td>" + (r.hasta ? hhmmTz(r.hasta) + (r.auto ? '<br><span class="desc">🔒 cerrado solo</span>' : "") : "en curso") + "</td><td>" +
            hm(Math.max(0, Math.round((new Date(r.hasta || ahora) - new Date(r.desde) - pausaMs(r)) / 60000))) +
            (pausaMs(r) >= 60000 ? '<br><span class="desc">−' + hm(Math.round(pausaMs(r) / 60000)) + " pausa</span>" : "") + "</td><td class=num>" +
            (r.cantidad == null ? "—" : num(r.cantidad)) + "</td><td class=num>" + (r.unidades == null ? "—" : num(r.unidades)) + "</td></tr>";
        }).join("") + "</table>" : '<div class="vacio">—</div>';
      // 1.32: el ritmo no cuenta los tramos de menos de 2 min (D35), netos de pausas; si sólo hubo de ésos, se dice
      const cortos = rows.filter((r) => r.hasta && r.cantidad != null && new Date(r.hasta) - new Date(r.desde) - pausaMs(r) < 120000).length;
      if (prodDatos.errRitmo) { $("prodRitmo").innerHTML = '<div class="vacio">⚠ No pude leer el ritmo (' + esc(prodDatos.errRitmo) + ")</div>"; return; }
      const rr = (prodDatos.ritmo || []).filter((r) => pasa(r.area, r.empleado, r.grupo));
      let prevR = null;
      $("prodRitmo").innerHTML = rr.length ? "<table><tr><th>Operario</th><th>Área</th><th>Grupo<br><span class=desc>códigos</span></th><th>Hecho</th><th>Horas</th><th>Por<br>hora</th><th>Prom.<br>grupo 4 sem</th><th>vs<br>prom.</th></tr>" +
        rr.map((r) => {
          const nuevo = r.empleado !== prevR; prevR = r.empleado;
          const pct = r.por_hora != null && r.prom_grupo ? Math.round((r.por_hora / r.prom_grupo - 1) * 100) : null;
          const cpct = pct == null ? "" : pct <= -20 ? "malo" : pct >= 20 ? "bueno" : "";
          return '<tr' + (nuevo ? ' class="sep"' : "") + '><td class=izq>' + (nuevo ? "<b>" + esc(r.empleado) + "</b>" : "") + "</td><td>" + esc(r.area) + "</td><td class=izq>" + (r.grupo ? esc(r.grupo) + '<br><span class="desc">' + esc(r.codigos || "") + "</span>" : "—") +
            '</td><td class=num>' + num(r.hecho) + ' <span class="desc">' + esc(r.unidad) + "</span></td><td>" + hm(Math.round(r.horas * 60)) +
            "</td><td class=num>" + (r.por_hora == null ? "—" : num(r.por_hora)) + "</td><td class=num>" + (r.prom_grupo == null ? "—" : num(r.prom_grupo)) +
            '</td><td class="num ' + cpct + '">' + (pct == null ? "—" : (pct > 0 ? "+" : "") + pct + " %") + "</td></tr>";
        }).join("") + "</table>" : '<div class="vacio">' + (cortos ? "Sin tramos de 2 min o más con cantidad ese día: " +
          (cortos === 1 ? "el que hubo duró menos" : "los " + cortos + " que hubo duraron menos") + " y el ritmo no los cuenta."
          : "Sin tramos con cantidad ese día.") + "</div>";
    }

    /* ---------- RENDIMIENTO (1.37, Elías: «tablas por rendimiento… en una columna las variables y una columna por persona»
       · «el rendimiento tiene que estar medido en cuántos segundos tardan por unidad») ---------- */
    // Una tabla por área. Fila = la variable (Corte: moldura · Grampeado: moldura + medida del aro · el resto: la familia,
    // gt.variable_rendimiento). Columna = cada operario que trabajó ahí + el promedio. Celda = SEGUNDOS POR UNIDAD: tiempo
    // neto de pausas ÷ unidades (cajas × UxB en las áreas de producto). «Prom.» = el de la fila: el tiempo de todos ÷ todas
    // las unidades. Verde = 20 % más rápido que el Prom., rojo = 20 % más lento. 1.38 (Elías: «¿qué es prom?»): con menos
    // de 15 min de datos el número sale igual, en gris y sin color (antes salía el tiempo acumulado, «0:04», y parecían
    // segundos); el tiempo y las unidades van en el globito.
    const REND = [["CORTE", "Corte", "Moldura · largo", "pieza"], ["GRAMP", "Grampeado", "Aro", "aro"], ["ENCOL", "Encolado", "Medida", "unidad"],
      ["MONT", "Montaje", "Familia", "unidad"], ["GANCHO", "Gancho", "Familia", "unidad"], ["EMBL", "Emblistado", "Familia", "unidad"],
      ["CONTR", "Contraído", "Familia", "unidad"]];
    const DE_A_DOS = ["ENCOL", "CONTR"];   // D45 · gt_v153: la pareja se reparte las unidades según el tiempo neto de cada uno
    async function cargarRend() {
      if (!$("rendHasta").value) $("rendHasta").value = hoyAR();
      if (!$("rendDesde").value) { const d = new Date($("rendHasta").value + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - 27); $("rendDesde").value = d.toISOString().slice(0, 10); }
      $("rendInfo").textContent = "Cargando…";
      let r;
      try { r = await rpc("gt_admin_rendimiento", { p_pass: pass || "", p_desde: $("rendDesde").value, p_hasta: $("rendHasta").value }); }
      catch (e) { $("rendInfo").textContent = "⚠ No pude leer el rendimiento (" + e.message + ")"; return; }
      if (!r && !(await claveOk())) return;
      const filas = (r && r.filas) || [], MIN = 15 * 60;
      const s1 = (x) => x.toLocaleString("es-AR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      const leg = (l) => { const m = String(l || "").match(/\d+/); return m ? Number(m[0]) : 1e9; };
      $("rendInfo").textContent = filas.reduce((n, f) => n + f.tramos, 0) + " tramos · segundos por unidad, sin pausas · Prom. = el de toda la fila · en gris: menos de 15 min de datos";
      const sinDatos = REND.filter(([cod]) => !filas.some((f) => f.rubro === cod)).map(([, nom]) => nom);
      $("rendTablas").innerHTML = REND.filter(([cod]) => filas.some((f) => f.rubro === cod)).map(([cod, nom, varNom, uni]) => {
        const fa = filas.filter((f) => f.rubro === cod);
        const tit = "<h2>" + nom + (DE_A_DOS.includes(cod) ? ' <span class="desc">de a dos: las unidades se reparten según el tiempo de cada uno</span>' : "") +
          ' <span class="desc">· segundos por ' + uni + "</span></h2>";
        const emps = [...new Set(fa.slice().sort((a, b) => leg(a.legajo) - leg(b.legajo) || a.empleado.localeCompare(b.empleado)).map((f) => f.empleado))];
        const vars = [...fa.reduce((m, f) => { const v = m.get(f.variable) || { v: f.variable, u: 0, s: 0 }; v.u += Number(f.unidades); v.s += Number(f.segundos); return m.set(f.variable, v); }, new Map()).values()]
          .sort((a, b) => b.u - a.u);
        const celda = (f, prom) => {
          if (!f) return "<td>—</td>";
          const t = Number(f.segundos), u = Number(f.unidades), x = t / u, txt = num(u) + " u en " + hm(Math.round(t / 60)) + " · " + f.tramos + " tramo" + (f.tramos > 1 ? "s" : "");
          if (t < MIN) return '<td class="poco" title="' + esc("pocos datos: " + txt) + '">' + s1(x) + "</td>";
          const cl = prom == null ? "" : x <= prom * 0.8 ? "bueno" : x >= prom * 1.2 ? "malo" : "";
          return '<td class="num ' + cl + '" title="' + esc(txt) + '">' + s1(x) + "</td>";
        };
        return '<div class="bloque">' + tit + "<table><tr><th>" + varNom + "</th>" + emps.map((e) => "<th>" + esc(e) + "</th>").join("") + "<th>Prom.</th></tr>" +
          vars.map((v) => {
            const prom = v.s >= MIN ? v.s / v.u : null;
            return "<tr><td class=izq>" + esc(v.v) + "</td>" + emps.map((e) => celda(fa.find((f) => f.variable === v.v && f.empleado === e), prom)).join("") +
              (prom == null ? '<td class="poco" title="' + esc("pocos datos: " + num(v.u) + " u en " + hm(Math.round(v.s / 60))) + '">' + s1(v.s / v.u) + "</td>"
                : "<td class=num><b>" + s1(prom) + "</b></td>") + "</tr>";
          }).join("") + "</table></div>";
      }).join("") +
      // las áreas sin datos van juntas en una línea (sin bloques vacíos)
      (sinDatos.length ? '<div class="vacio">Sin tramos de 2 min o más con cantidad en el período: ' + esc(sinDatos.join(", ")) + ".</div>" : "");
    }

    /* ---------- ASISTENCIA ---------- */
    async function cargarAsis() {
      const dia = $("asisDia").value || hoyAR();
      const esHoy = dia === hoyAR();
      const ahora = new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 19);   // hora AR, mismo formato que la base
      $("asisInfo").textContent = "Cargando…";
      let rows = null;
      // 1.69: asistencia3 suma «libre» (franco) · 1.33: asistencia2 suma el ingreso con código y el 1.er trabajo (gt_v147)
      for (const fn of ["gt_admin_asistencia3", "gt_admin_asistencia2", "gt_admin_asistencia"]) {
        try { rows = await rpc(fn, { p_pass: pass || "", p_dia: dia }); break; }
        catch (e) { if (fn === "gt_admin_asistencia") { $("asisInfo").textContent = "⚠ No pude leer la asistencia (" + e.message + ")"; return; } }
      }
      if (!rows.length && !(await claveOk())) return;
      const corre = (ts, min) => { const d = new Date(String(ts).replace(" ", "T") + "Z"); d.setUTCMinutes(d.getUTCMinutes() + min); return d.toISOString().slice(0, 19); };
      const t19 = (ts) => String(ts).replace(" ", "T").slice(0, 19);
      let faltas = 0, francos = 0;
      const html = rows.map((r) => {
        // 1.69: el día de franco no se espera que fiche: «Franco», no «No vino» (si vino igual, se muestra como siempre)
        if (r.libre && !r.entrada) { francos++; return "<tr class=baja><td class=izq><b>" + esc(r.empleado) + '</b> <span class="desc">' + esc(r.legajo || "") + '</span></td><td colspan="4" class="desc">Franco</td><td class=izq><span class="chip c-mut">Franco</span></td></tr>'; }
        const tol = r.tolerancia_min || 5, chips = [];
        let ent, alm = "—", sal = "—", prod = "—";
        if (!r.entrada) { ent = '<span class="t-err">—</span>'; chips.push('<span class="chip c-err">No vino</span>'); }
        else {
          ent = hhmm(r.entrada);
          if (t19(r.entrada) > corre(r.entrada_prevista, tol)) { ent = '<span class="t-err">' + ent + "</span>"; chips.push('<span class="chip c-err">Llegó tarde</span>'); }
          else if (t19(r.entrada) > t19(r.entrada_prevista)) { ent = '<span class="t-warn">' + ent + "</span>"; chips.push('<span class="chip c-warn">Entrada en tolerancia</span>'); }
          // 1.33 (Elías): el ingreso (código) puede ser antes de las 8 (desayuno); el 1.er trabajo productivo empieza a las 8
          if (r.productivo) {
            const dem = Math.round((Date.parse(t19(r.productivo) + "Z") - Date.parse(t19(r.entrada_prevista) + "Z")) / 60000);
            prod = hhmm(r.productivo);
            if (dem > tol) { prod = '<span class="t-err">' + prod + "</span>"; chips.push('<span class="chip c-err">Arrancó ' + dem + " min tarde</span>"); }
            else if (dem > 0) prod = '<span class="t-warn">' + prod + "</span>";
            prod += '<div class="desc">' + esc(r.productivo_area || "") + "</div>";
          } else if ("productivo" in r && (!esHoy || ahora > corre(r.entrada_prevista, tol))) {
            prod = '<span class="t-err">—</span>'; chips.push('<span class="chip c-err">Sin trabajo productivo</span>');
          }
          if (!r.almuerzo_desde && !r.flexible) alm = '<span class="desc">de corrido</span>';
          else if (!r.almuerzo_sale) {
            alm = '<span class="desc">' + (r.flexible ? "rotativo · " : "") + "no fichó</span>";
            if (!r.flexible && (!esHoy || ahora > t19(r.almuerzo_desde))) chips.push('<span class="chip c-err">Sin almuerzo</span>');
          } else {
            let s = hhmm(r.almuerzo_sale), v = r.almuerzo_vuelve ? hhmm(r.almuerzo_vuelve) : "…";
            if (!r.flexible) {
              if (t19(r.almuerzo_sale) < corre(r.almuerzo_desde, -tol)) { s = '<span class="t-err">' + s + "</span>"; chips.push('<span class="chip c-err">Salió antes a almorzar</span>'); }
              else if (t19(r.almuerzo_sale) < t19(r.almuerzo_desde)) s = '<span class="t-warn">' + s + "</span>";
              if (r.almuerzo_vuelve && t19(r.almuerzo_vuelve) > corre(r.almuerzo_hasta, tol)) { v = '<span class="t-err">' + v + "</span>"; chips.push('<span class="chip c-err">Volvió tarde</span>'); }
              else if (r.almuerzo_vuelve && t19(r.almuerzo_vuelve) > t19(r.almuerzo_hasta)) v = '<span class="t-warn">' + v + "</span>";
            }
            alm = s + "–" + v + (r.flexible ? ' <span class="desc">rotativo</span>' : "");
          }
          if (r.termino) {
            sal = hhmm(r.fin);
            if (t19(r.fin) < corre(r.salida_prevista, -tol)) { sal = '<span class="t-err">' + sal + "</span>"; chips.push('<span class="chip c-err">Se fue antes</span>'); }
            else if (t19(r.fin) < t19(r.salida_prevista)) { sal = '<span class="t-warn">' + sal + "</span>"; chips.push('<span class="chip c-warn">Salida en tolerancia</span>'); }
          } else if (!esHoy || ahora > t19(r.salida_prevista)) {
            sal = '<span class="t-err">—</span>'; chips.push('<span class="chip c-err">No terminó el día</span>');
          } else sal = '<span class="desc">trabajando</span>';
          if (r.area_abierta && (!esHoy || ahora > t19(r.salida_prevista))) chips.push('<span class="chip c-warn">Dejó un área abierta</span>');
        }
        if (chips.some((c) => c.includes("c-err"))) faltas++;
        if (!chips.length) chips.push('<span class="chip c-ok">OK</span>');
        return "<tr><td class=izq><b>" + esc(r.empleado) + '</b> <span class="desc">' + esc(r.legajo || "") + "</span></td><td>" + ent +
          '<div class="desc">' + hhmm(r.entrada_prevista) + (r.entrada && r.con_codigo === false ? " · 1.er registro" : "") + "</div></td><td>" + prod + "</td><td>" + alm +
          (r.almuerzo_desde ? '<div class="desc">' + hhmm(r.almuerzo_desde) + "–" + hhmm(r.almuerzo_hasta) + "</div>" : "") + "</td><td>" + sal +
          '<div class="desc">' + hhmm(r.salida_prevista) + "</div></td><td class=izq>" + chips.join("") + "</td></tr>";
      }).join("");
      $("asisInfo").textContent = rows.length + " operarios · " + faltas + " con faltas" + (francos ? " · " + francos + " de franco" : "") + " · abajo de cada hora, la que le toca";
      $("asisTabla").innerHTML = rows.length ? "<table><tr><th>Operario</th><th>Ingreso</th><th>1.er<br>trabajo</th><th>Almuerzo</th><th>Salida</th><th>Estado</th></tr>" + html + "</table>"
        : '<div class="vacio">Sin datos.</div>';
    }
    /* ---------- PEDIDOS (D29: por ahora sólo desde el admin) ---------- */
    const EST = { abierto: ["c-warn", "Abierto"], parcial: ["c-warn", "Parcial"], armado: ["c-ok", "Armado"], cargado: ["c-ok", "Cargado"], entregado: ["c-mut", "Entregado"], cancelado: ["c-err", "Cancelado"] };
    const ddmm = (d) => d ? String(d).slice(8, 10) + "/" + String(d).slice(5, 7) : "";
    const hora = () => new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
    async function cargarPed() {
      $("pedInfo").textContent = "Cargando…";
      let rows;
      try { rows = await rpc("gt_admin_pedidos", { p_pass: pass || "", p_cerrados: $("pedCerr").checked }); }
      catch (e) { $("pedInfo").textContent = "⚠ No pude leer los pedidos (" + e.message + ")"; return; }
      if (!rows.length && !(await claveOk())) return;

    // una lista vacía puede ser «no hay nada» o «clave mala»: lo distingue el monitor

    /* ---------- BOTONERA DEL OPERARIO (1.66) ---------- */

    /* ---------- EMPLEADOS (1.69, Angely 30/10/2026): alta, baja y horario por día ---------- */
    // Alta y baja de los empleados con SU horario: lo leen Asistencia, los avisos de llegada y el cierre automático. La baja no borra nada:
    // activo = false (el historial queda). Las plantas sólo se suman: sacar una es un borrado y todavía no se hace desde acá.
    const DIAS = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"], h5 = (t) => String(t == null ? "" : t).slice(0, 5);
    let emps = [], gral = null, editId = null;
    function plantaNombre(c) { const p = ((gral && gral.plantas) || []).find((x) => x.codigo === c); return p ? p.nombre : c; }
    function resumenHorario(e) {
      if (!e.con_horario) return '<span class="desc">general ' + h5(gral.entrada) + "–" + h5(gral.salida) + " · alm " + h5(gral.almuerzo_desde) + "–" + h5(gral.almuerzo_hasta) + "</span>";
      const firma = (d) => d.libre ? "L" : [d.entrada, d.almuerzo_desde, d.almuerzo_hasta, d.sin_almuerzo ? 1 : 0, d.salida].join("|");
      const por = {}; (e.horario || []).forEach((d) => { por[d.dow] = d; });
      const grupos = []; let ult = null;
      for (let dow = 1; dow <= 7; dow++) {
        const d = por[dow];
        if (!d) { ult = null; continue; }
        if (ult && ult.f === firma(d)) ult.hasta = dow; else { ult = { f: firma(d), desde: dow, hasta: dow, d }; grupos.push(ult); }
      }
      return grupos.filter((g) => !g.d.libre).map((g) => {
        const d = g.d, rango = g.desde === g.hasta ? DIAS[g.desde - 1] : DIAS[g.desde - 1] + "–" + DIAS[g.hasta - 1];
        return "<b>" + rango + "</b> " + d.entrada + "–" + d.salida +
          (e.flexible ? ' <span class="desc">alm flexible</span>' : d.sin_almuerzo ? ' <span class="desc">de corrido</span>' : ' <span class="desc">alm ' + d.almuerzo_desde + "–" + d.almuerzo_hasta + "</span>");
      }).join("<br>") || '<span class="desc">sin días de trabajo</span>';
    }
    async function cargarEmp() {
      $("empInfo").textContent = "Cargando…";
      let r;
      try {
        r = await rpc("gt_admin_empleados", { p_pass: pass || "", p_bajas: $("empBajas").checked });
        gral = await rpc("gt_admin_horario_general", { p_pass: pass || "" });
      } catch (e) { $("empInfo").textContent = "⚠ No pude leer los empleados (" + e.message + ")"; return; }
      if (!r.length && !(await claveOk())) return;
      emps = r;
      const act = r.filter((e) => e.activo).length;
      $("empInfo").textContent = act + " activos" + (r.length > act ? " · " + (r.length - act) + " de baja" : "") + " · actualizado " + hora();
      $("empLista").innerHTML = r.length ? "<table><tr><th>Legajo</th><th>Nombre</th><th>Plantas</th><th>Horario</th><th>Estado</th><th></th></tr>" + r.map((e) =>
        '<tr class="' + (e.activo ? "" : "baja") + '"><td>' + esc(e.legajo || "—") + "</td><td class=izq><b>" + esc(e.nombre) + "</b></td><td>" +
        ((e.plantas && e.plantas.length) ? e.plantas.map((c) => esc(plantaNombre(c))).join(" · ") : esc(plantaNombre(gral.principal))) + "</td><td class=izq>" + resumenHorario(e) + "</td><td>" +
        (e.activo ? '<span class="chip c-ok">Activo</span>' : '<span class="chip c-mut">De baja' + (e.baja_en ? " " + ddmm(String(e.baja_en).slice(0, 10)) : "") + "</span>") +
        '</td><td class="acc"><button data-acc="editar" data-id="' + e.id + '">Editar</button>' +

        : '<div class="vacio">No hay empleados cargados.</div>';

    // el horario de arranque: el del empleado, o el general (lunes a viernes; sábado y domingo de franco)
    function horarioBase(e) {
      const por = {}; ((e && e.horario) || []).forEach((d) => { por[d.dow] = d; });
      const out = {};
      for (let dow = 1; dow <= 7; dow++) {
        const d = por[dow];
        out[dow] = d ? { libre: !!d.libre, entrada: h5(d.entrada), almuerzo_desde: h5(d.almuerzo_desde), almuerzo_hasta: h5(d.almuerzo_hasta), sin_almuerzo: !!d.sin_almuerzo, salida: h5(d.salida) }
          : dow <= 5 && !(e && e.con_horario) ? { libre: false, entrada: h5(gral.entrada), almuerzo_desde: h5(gral.almuerzo_desde), almuerzo_hasta: h5(gral.almuerzo_hasta), sin_almuerzo: false, salida: h5(gral.salida) }
          : { libre: true, entrada: "", almuerzo_desde: "", almuerzo_hasta: "", sin_almuerzo: false, salida: "" };
      }
      return out;
    }
    function pintarSemana(h) {
      let t = "<tr><th></th><th>Trabaja</th><th>Entrada</th><th>Almuerzo<br>desde</th><th>Almuerzo<br>hasta</th><th>De<br>corrido</th><th>Salida</th></tr>";
      for (let dow = 1; dow <= 7; dow++) {
        const d = h[dow];
        t += '<tr data-dow="' + dow + '"><td class="dia">' + DIAS[dow - 1] + '</td><td><input type="checkbox" class="ef-trab"' + (d.libre ? "" : " checked") + "></td>" +
          '<td><input type="time" class="ef-ent" value="' + d.entrada + '"></td><td><input type="time" class="ef-ad" value="' + d.almuerzo_desde + '"></td>' +
          '<td><input type="time" class="ef-ah" value="' + d.almuerzo_hasta + '"></td><td><input type="checkbox" class="ef-sin"' + (d.sin_almuerzo ? " checked" : "") + '></td>' +
          '<td><input type="time" class="ef-sal" value="' + d.salida + '"></td></tr>';

      $("efSemana").innerHTML = t; actualizarSemana();

    // lo que no corresponde se apaga: un día de franco no tiene horas, «de corrido» o el almuerzo flexible no tienen almuerzo
    function actualizarSemana() {
      const flex = $("efFlex").checked;
      document.querySelectorAll("#efSemana tr[data-dow]").forEach((tr) => {

        tr.querySelector(".ef-ad").disabled = tr.querySelector(".ef-ah").disabled = !trab || sin || flex;
      });
    }
    function efMsg(t, err) { $("efMsg").textContent = t || ""; $("efMsg").classList.toggle("err", !!err); }
    function abrirForm(e) {
      editId = e ? e.id : null;
      $("efTit").textContent = e ? "Editar: " + e.nombre : "Alta de empleado";
      $("efNombre").value = e ? e.nombre : ""; $("efLegajo").value = e && e.legajo ? e.legajo : "";
      $("efFlex").checked = !!(e && e.flexible);

        return '<label class="ef-chk"><input type="checkbox" class="ef-pl" value="' + esc(p.codigo) + '"' + (tiene.includes(p.codigo) ? " checked" : "") + (ya ? ' disabled title="Sacarle una planta no se puede desde acá todavía"' : "") + "> " + esc(p.nombre) + "</label>";

    function cerrarForm() { $("empForm").classList.add("hidden"); editId = null; efMsg(""); }
    function copiarLunes() {
      const lun = document.querySelector('#efSemana tr[data-dow="1"]');
      for (let dow = 2; dow <= 5; dow++) {
        const tr = document.querySelector('#efSemana tr[data-dow="' + dow + '"]');
        ["trab", "sin"].forEach((c) => { tr.querySelector(".ef-" + c).checked = lun.querySelector(".ef-" + c).checked; });
        ["ent", "ad", "ah", "sal"].forEach((c) => { tr.querySelector(".ef-" + c).value = lun.querySelector(".ef-" + c).value; });
      }
      actualizarSemana();
    }
    // lee el formulario y lo valida igual que la base (la base lo vuelve a validar)
    function leerForm() {
      const nombre = $("efNombre").value.trim().replace(/\s+/g, " "), flex = $("efFlex").checked, horario = [];
      if (!nombre) return { err: "Falta el nombre" };
      let trab = 0;
      for (const tr of document.querySelectorAll("#efSemana tr[data-dow]")) {
        const dow = Number(tr.dataset.dow), q = (c) => tr.querySelector(".ef-" + c);
        if (!q("trab").checked) { horario.push({ dow, libre: true }); continue; }
        const d = { dow, libre: false, entrada: q("ent").value, salida: q("sal").value, sin_almuerzo: q("sin").checked && !flex, almuerzo_desde: q("ad").value, almuerzo_hasta: q("ah").value };
        const dia = DIAS[dow - 1];
        if (!d.entrada || !d.salida || d.entrada >= d.salida) return { err: dia + ": la entrada tiene que ser antes que la salida" };
        if (!d.sin_almuerzo && !flex && !(d.almuerzo_desde && d.almuerzo_hasta && d.entrada < d.almuerzo_desde && d.almuerzo_desde < d.almuerzo_hasta && d.almuerzo_hasta < d.salida))
          return { err: dia + ": el almuerzo tiene que quedar entre la entrada y la salida" };
        horario.push(d); trab++;
      }
      if (!trab) return { err: "Tiene que trabajar al menos un día" };
      const plantas = [...document.querySelectorAll("#efPlantas .ef-pl:checked")].map((c) => c.value);
      if (!plantas.length) return { err: "Elegí al menos una planta" };
      return { nombre, legajo: $("efLegajo").value.trim(), flex, horario, plantas };
    }
    async function guardarEmp() {

    async function bajaEmp(id, activo) {

    /* ---------- CAJAS (1.68, Angely 29/10/2026): cuántas cajas hay que armar, en vivo ---------- */
    // hacen_falta = lo emblistado que todavía no se contrajo (en cajas) · armadas = el stock de cajas armadas · a_armar = la diferencia.
    // Contraer baja las dos a la vez, así que «armar N» no se mueve al contraer. Hasta el corte de conteo no hay números.
    const entero = (n) => num(Math.round(Number(n) || 0));
    async function cargarCajas(silencioso) {
      if (!silencioso) $("cajasInfo").textContent = "Cargando…";
      let rows;
      try { rows = await rpc("gt_admin_cajas", { p_pass: pass || "" }); }
      catch (e) { $("cajasInfo").textContent = "⚠ No pude leer las cajas (" + e.message + ")"; return; }
      if (!rows.length && !(await claveOk())) return;
      const corte = rows.length ? rows[0].corte_en : null, sinCaja = rows.find((r) => r.caja === "(sin caja)");
      const cajas = rows.filter((r) => r.caja !== "(sin caja)");
      const fCorte = corte ? new Date(corte).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: "America/Argentina/Buenos_Aires" }).replace(",", "") : "";
      $("cajasInfo").textContent = (corte ? "Corte " + fCorte + " · " : "") + "actualizado " + hora() + " · se actualiza solo cada 10 s";
      if (!corte) {
        $("cajasAviso").innerHTML = '<div class="aviso-c">⚠ Falta el corte de conteo: cargar las cajas armadas y lo emblistado. Hasta entonces no hay números.</div>';
        $("cajasTabla").innerHTML = '<div class="vacio">Sin corte.</div>';
        return;
      }
      $("cajasAviso").innerHTML = sinCaja && Number(sinCaja.articulos) > 0
        ? '<div class="aviso-c">⚠ ' + sinCaja.articulos + " artículos emblistados sin caja cargada (" + entero(sinCaja.hacen_falta) + " cajas): no cuentan en ninguna fila.</div>" : "";
      const orden = { armar: 0, nomas: 1, nada: 2 };
      const con = cajas.filter((r) => r.tono !== "nada").sort((a, b) => (orden[a.tono] - orden[b.tono]) || (Number(b.a_armar) - Number(a.a_armar)) || (Number(b.hacen_falta) - Number(a.hacen_falta)));
      const sin = cajas.filter((r) => r.tono === "nada").map((r) => r.caja);
      $("cajasTabla").innerHTML = (con.length ? "<table><tr><th>Caja</th><th>Artíc.</th><th>Emblist.<br>(cajas)</th><th>Arma-<br>das</th><th>Estado</th></tr>" +
        con.map((r) => "<tr><td class=\"caja-n\">" + esc(r.caja) + "</td><td>" + num(r.articulos) + "</td><td>" + entero(r.hacen_falta) + "</td><td>" +
          (r.armadas == null ? "—" : entero(r.armadas)) + "</td><td class=\"" + (r.tono === "nomas" ? "caja-nomas" : "caja-armar") + "\">" + esc(r.estado) + "</td></tr>").join("") + "</table>"
        : '<div class="vacio">Nada emblistado ni armado.</div>') +
        (sin.length ? '<div class="desc" style="margin-top:8px;text-align:center">Sin emblistado ni armadas: ' + sin.map(esc).join(" · ") + "</div>" : "");
    }

      if (b.dataset.acc === "editar" && e) abrirForm(e); else bajaEmp(id, b.dataset.acc === "alta");
    });
    $("cajasRef").onclick = () => cargarCajas();
    setInterval(() => { if (!document.hidden && tab === "cajas") cargarCajas(true); }, 10000);   // 1.68: en vivo
    setInterval(() => { if (document.hidden) return; if (tab === "prod" && $("prodDia").value === hoyAR()) cargarProd();
                        if (tab === "asis" && $("asisDia").value === hoyAR()) cargarAsis(); }, 60000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden && tab === "monitor") pedir(); });
    $("passBtn").onclick = entrar;
    $("passInput").addEventListener("keydown", (e) => { if (e.key === "Enter") entrar(); });
    $("salirMon").onclick = (e) => { e.preventDefault(); olvidarPass(); verLogin(); };
    verTab("monitor", true);
  })();
  </script>
</body>
</html>
